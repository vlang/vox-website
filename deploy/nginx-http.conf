server {
    listen 80;
    listen [::]:80;
    server_name vox-browser.org www.vox-browser.org;

    access_log /var/log/nginx/vox-browser.org.access.log;
    error_log /var/log/nginx/vox-browser.org.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vox-browser.org/acme;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        root /var/www/vox-browser.org/current;
        try_files $uri =404;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_cache off;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
